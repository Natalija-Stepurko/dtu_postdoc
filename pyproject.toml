[project]
name = "nbswitch"
version = "0.2.0"
description = "Structure-grounded design of protease-activated nanobody masks"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "matplotlib>=3.8",
  "pandas>=2.1",
  "biotite>=1.0",
  "riot-na>=5.3",            # antibody numbering: Kabat, Chothia, IMGT
]

[project.optional-dependencies]
folding = ["torch>=2.2", "transformers>=4.40", "accelerate>=0.30"]
dev = ["pytest>=8.0", "playwright>=1.44"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nbswitch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
